# Interrupt-driven UART for the shell on uart30
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_30_INTERRUPT_DRIVEN=y

# Person detection on the Axon NPU
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=229376
CONFIG_FPU=y

# Fixed-size net bufs; room for several MTU-sized datagrams queued towards the link
CONFIG_NET_BUF_DATA_SIZE=256

# LTE over an nRF93M1 in modem bypass, through CMUX and PPP, on UARTE00 at 3 Mbaud
CONFIG_APP_MODEM_AT=y
CONFIG_APP_MODEM_AT_LOG_LEVEL_ERR=y

CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y

# Cellular modem driver
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_DEDICATED_WORKQUEUE=y
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=532
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=1024
CONFIG_MODEM_AT_SHELL=n
CONFIG_MODEM_AT_USER_PIPE_IDX=0
CONFIG_MODEM_CELLULAR_USER_PIPE_BUFFER_SIZES=1024
CONFIG_MODEM_MODULES_LOG_LEVEL_INF=y
CONFIG_MODEM_CMUX_LOG_LEVEL_INF=y

# Async UART with hardware flow control towards the modem
CONFIG_UART_ASYNC_API=y
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_RECEIVE_IDLE_TIMEOUT_MS=1
CONFIG_MODEM_CMUX_MSC_FC_THRESHOLD=32

CONFIG_UART_00_ASYNC=y
CONFIG_UART_00_INTERRUPT_DRIVEN=n
CONFIG_APP_NETWORK_MODEM_BAUDRATE=3000000
