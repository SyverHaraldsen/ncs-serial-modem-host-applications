# Interrupt-driven UART for the shell on uart20
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_20_INTERRUPT_DRIVEN=y

# Person detection on the Axon NPU
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=229376
CONFIG_NRF_AXON_INTERLAYER_BUFFER_MEMREGION_NAME="AXON_SRAM"
CONFIG_FPU=y

# Wi-Fi station; overlay-lte-nrf7120dk adds the PPP link next to it, either one streams alone.
CONFIG_WIFI=y
CONFIG_WIFI_NRF71_PATCH=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_SHELL_GETOPT=y
CONFIG_ENTROPY_GENERATOR=y

# Connect on boot to networks stored with "wifi cred add"
CONFIG_WIFI_CREDENTIALS=y
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_DOWN=n

# The supplicant runs in these threads' event callbacks.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4200
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=5400
# Wi-Fi disconnect runs the supplicant in the calling network thread.
CONFIG_APP_NETWORK_THREAD_STACK_SIZE=6144

# Wi-Fi needs variable-size net bufs; same TX room as the fixed pool on the LM20
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=16384
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=8192

# One IPv4 config per interface: Wi-Fi and PPP
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# High camera profile for Wi-Fi; LTE keeps the 320x240 default
CONFIG_APP_CAMERA_HIGH_WIDTH=640
CONFIG_APP_CAMERA_HIGH_HEIGHT=480
CONFIG_APP_CAMERA_HIGH_JPEG_QUALITY=2
CONFIG_APP_CAMERA_BUFFER_SIZE=49152
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=148480
CONFIG_APP_DETECTION_SLOT_SIZE=49152
