<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .npu { fill: #e0f6fb; stroke: #00a9ce; stroke-width: 1.5; }
    .dk { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .text { fill: #24292f; }
    .label { fill: #57606a; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .npu { fill: #0b2f38; stroke: #00a9ce; }
      .dk { stroke: #6e7681; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="dk" x="170" y="14" width="300" height="182" rx="10"/>
  <text class="label" x="184" y="34">nRF7120 DK or nRF54LM20 DK</text>

  <rect class="box" x="10" y="47" width="116" height="44" rx="8"/>
  <text class="text" x="68" y="74" text-anchor="middle">Arducam Mega</text>

  <rect class="box" x="200" y="47" width="120" height="44" rx="8"/>
  <text class="text" x="260" y="74" text-anchor="middle">JPEG frame</text>

  <rect class="npu" x="200" y="134" width="120" height="44" rx="8"/>
  <text class="text" x="260" y="161" text-anchor="middle">Axon NPU</text>

  <rect class="box" x="520" y="90" width="120" height="44" rx="8"/>
  <text class="text" x="580" y="117" text-anchor="middle">udp_rx.py</text>

  <rect class="box" x="680" y="90" width="100" height="44" rx="8"/>
  <text class="text" x="730" y="117" text-anchor="middle">Browser</text>

  <path class="line" d="M126,69 H198" marker-end="url(#arrow)"/>
  <text class="label" x="148" y="62" text-anchor="middle">SPI</text>

  <path class="line" d="M260,91 V132" marker-end="url(#arrow)"/>
  <text class="label" x="268" y="116">160x128</text>

  <path class="line" d="M320,69 H420 L518,104" marker-end="url(#arrow)"/>
  <text class="label" x="370" y="62" text-anchor="middle">video</text>

  <path class="line" d="M320,156 H420 L518,122" marker-end="url(#arrow)"/>
  <text class="label" x="370" y="174" text-anchor="middle">boxes</text>

  <path class="line" d="M640,112 H678" marker-end="url(#arrow)"/>
</svg>
